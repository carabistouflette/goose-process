name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .toolchain
          key: goose-${{ runner.os }}-${{ hashFiles('GOOSE_REVISION', 'scripts/setup-goose.sh') }}
      - run: make setup
      - run: make check test
        env:
          CC: ${{ matrix.cc }}
      - run: make sanitize CFLAGS="-std=c11 -Wall -Wextra -Werror -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=3"
        env:
          SANITIZER_CC: ${{ matrix.cc }}
      - name: Diagnose sanitizer hook failures
        if: ${{ failure() }}
        run: |
          gcc --version
          nm .build/syscalls-sanitize | rg 'poll|read|wrap' || true
      - name: Check the published fixture-tool consumer
        if: ${{ matrix.cc == 'gcc' }}
        run: make checker-setup checker-source-test checker-consumer CC=gcc
      - run: make bench BENCH_ITERATIONS=5
        env:
          BENCH_CC: ${{ matrix.cc }}
      - run: make fuzz
        if: ${{ matrix.cc == 'clang' }}
